<script>
  function switchAuthTab(type) {
    const tabPhone = document.getElementById('tab-phone');
    const tabPass = document.getElementById('tab-passcode');
    const panePhone = document.getElementById('pane-phone');
    const panePass = document.getElementById('pane-passcode');

    if (type === 'phone') {
      tabPhone.className = "flex-1 py-2 rounded font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";

      panePhone.classList.remove('hidden');
      panePass.classList.add('hidden');
    } else {
      tabPass.className = "flex-1 py-2 rounded font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabPhone.className = "flex-1 py-2 rounded font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5";
      panePass.classList.remove('hidden');
      panePhone.classList.add('hidden');
    }
  }
